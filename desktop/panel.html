<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'">
  <title>Pengu Recorder</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="card">
    <header class="head drag">
      <img src="../assets/pengu-logo.png" alt="" class="logo">
      <span class="brand">Pengu Recorder</span>
      <button id="close" class="round" title="Close Pengu Recorder" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div id="banner" class="banner hidden" role="status">
      <span id="banner-text"></span>
      <button id="banner-open" class="link hidden">Open folder</button>
      <button id="banner-dismiss" class="round small" aria-label="Dismiss">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <section class="rows">
      <label class="row" id="source-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <select id="source" aria-label="What to record"></select>
      </label>

      <label class="row" id="camera-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
        <select id="camera" aria-label="Camera"></select>
      </label>

      <div class="row" id="mic-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <select id="mic" aria-label="Microphone"></select>
        <button id="mic-toggle" class="pill on" aria-pressed="true">On</button>
      </div>
    </section>

    <div class="group">
      <span class="group-label">Layout</span>
      <div class="seg four" role="radiogroup" aria-label="Layout" id="layout">
        <button data-v="screen" role="radio">Screen</button>
        <button data-v="screen-cam" role="radio">Screen + cam</button>
        <button data-v="camera" role="radio">Cam only</button>
        <button data-v="studio" role="radio">Template</button>
      </div>
    </div>

    <div class="group" id="template-group">
      <div class="template-row">
        <select id="tpl" aria-label="Template">
          <option value="corner">Camera in a corner</option>
          <option value="framed-corner">Framed, camera in a corner</option>
          <option value="side">Side by side</option>
          <option value="split">Split screen</option>
          <option value="camera">Just you</option>
        </select>
        <select id="tpl-shape" aria-label="Camera shape">
          <option value="circle">Circle</option>
          <option value="square">Square</option>
          <option value="portrait">Rectangle</option>
        </select>
        <select id="tpl-corner" aria-label="Camera corner">
          <option value="br">Bottom right</option>
          <option value="bl">Bottom left</option>
          <option value="tr">Top right</option>
          <option value="tl">Top left</option>
        </select>
      </div>
      <button id="tpl-edit" class="link">Background, size and more…</button>
    </div>

    <div class="group" id="taskbar-group">
      <span class="group-label">Windows taskbar</span>
      <div class="seg" role="radiogroup" aria-label="Windows taskbar" id="taskbar">
        <button data-v="show" role="radio" title="Record the whole screen, taskbar included">Show</button>
        <button data-v="cut" role="radio" title="Cut the taskbar off. The video ends up slightly shorter than 16:9">Cut</button>
        <button data-v="fill" role="radio" title="Cut the taskbar and zoom in a little so the video stays a perfect 16:9">Cut &amp; fit 16:9</button>
      </div>
    </div>

    <button id="start" class="start">Start recording</button>
    <p class="hint" id="hint"></p>

    <nav class="tools">
      <button id="t-notes" class="tool" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        <span>Notes</span>
      </button>
      <button id="t-templates" class="tool">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg>
        <span>Templates</span>
      </button>
      <button id="t-folder" class="tool">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Videos</span>
      </button>
      <button id="t-more" class="tool" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        <span>More</span>
      </button>
    </nav>

    <section id="more" class="sheet hidden" aria-label="More options">
      <header class="sheet-head">
        <strong>More options</strong>
        <button id="more-close" class="round small" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </header>
      <label class="check"><input type="checkbox" data-setting="saveCamera"><span>Also save the camera alone<small>A separate file of just you, for Reels.</small></span></label>
      <label class="check"><input type="checkbox" data-setting="saveScreen"><span>Also save the screen alone<small>A separate file of the screen, no camera.</small></span></label>
      <label class="check"><input type="checkbox" data-setting="systemAudio"><span>Record computer sound<small>Videos, music and app sounds, besides your mic.</small></span></label>
      <label class="check"><input type="checkbox" data-setting="countdown"><span>3-2-1 countdown<small>Off starts recording the instant you click.</small></span></label>
      <label class="check"><input type="checkbox" data-setting="openFolder"><span>Show the files when done<small>Opens the folder with the new video selected.</small></span></label>
      <p class="shortcuts">While recording: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> stop · <kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>N</kbd> notes</p>
    </section>
  </main>
  <script src="panel.js"></script>
</body>
</html>
